note: >-
  The Allay Therapeutics content API declares no security schemes and requires no credentials for
  any operation catalogued in this repo. The WordPress REST index at /wp-json/ advertises exactly
  one authentication method — WordPress application passwords, with an authorization endpoint at
  https://www.allaytx.com/wp-admin/authorize-application.php — which is an administrative CMS
  sign-in flow for site editors, not a consumer API credential: there is no self-service signup, no
  key issuance, no scopes and no documentation. Allay Therapeutics publishes no developer
  authentication documentation because it runs no developer program; the read surface is simply
  open.
