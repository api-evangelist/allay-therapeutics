openapi: 3.1.0
info:
  title: Allay Therapeutics Content API
  version: wp/v2
  summary: Anonymously readable WordPress REST content API behind www.allaytx.com.
  description: >-
    The read-only content surface Allay Therapeutics exposes at https://www.allaytx.com/wp-json.
    Allay Therapeutics is a clinical-stage biopharmaceutical company in San Jose, California and
    Singapore developing ultra-sustained, non-opioid analgesic products for post-surgical pain
    management, led by the bupivacaine-based ATX-101 implant for total knee replacement. It runs no
    developer program and markets no product API. This document is an API Evangelist derivation of
    the WordPress `wp/v2` and `oembed/1.0` route index the site publishes at /wp-json/, restricted
    to the operations verified to return data anonymously on 2026-08-06. Every write route, the
    entire plugin-administration surface, and `/wp/v2/users` are deliberately excluded — see
    x-api-evangelist-provenance.
  contact:
    name: Allay Therapeutics
    url: https://www.allaytx.com/
    email: contact@allaytx.com
  x-api-evangelist-provenance: >-
    Derived by the API Evangelist enrichment pipeline from the live WordPress REST route index at
    https://www.allaytx.com/wp-json/ (196 routes across 10 namespaces: oembed/1.0, wpe/cache-plugin/v1,
    wpe_sign_on_plugin/v1, yoast/v1, duplicate-post/v1, monsterinsights/v1, wp/v2, wp-site-health/v1,
    wp-block-editor/v1 and wp-abilities/v1) and verified against live anonymous responses on
    2026-08-06. Every parameter below appears verbatim in the route index `args` for that endpoint,
    and every collection count in a description was read from the `X-WP-Total` response header on
    that date. Only operations that returned data without credentials are modelled. Anonymous 401s
    recorded at harvest: /wp/v2/settings (rest_forbidden), /wp/v2/menus (rest_cannot_view),
    /wp/v2/themes (rest_cannot_view_themes), /wp/v2/plugins (rest_cannot_view_plugins),
    /wp/v2/block-types (rest_block_type_cannot_view), /wp/v2/font-collections (rest_cannot_read),
    /wp/v2/icons (rest_cannot_view) and the whole wp-abilities/v1 namespace (rest_forbidden) — so no
    agent-capability, MCP or AgentCard surface is claimed for this provider. DELIBERATE EXCLUSION:
    /wp/v2/users answers anonymously with 7 author records (WordPress default author enumeration).
    The exposure is recorded here as a factual observation, but the endpoint is NOT modelled as an
    operation, NOT packaged as an agent skill, and no individual is named anywhere in this
    repository. Allay Therapeutics publishes no OpenAPI, no developer documentation and no API
    reference for this surface; the humanURL in apis.yml points at the upstream WordPress REST
    handbook that defines the wp/v2 contract. The deployment is served by WP Engine behind nginx,
    responses carry `x-robots-tag: noindex` and `cache-control: max-age=600, must-revalidate`.
    Nothing here was obtained with credentials.
servers:
  - url: https://www.allaytx.com/wp-json
    description: Production content API
tags:
  - name: posts
    description: >-
      News archive — press releases, in-the-news coverage, and presentations/publications. 19 posts
      published at harvest time, spanning 2021-05-13 (company launch with first clinical data)
      through 2025-06-05 (the $57.5M Series D announcement).
  - name: pages
    description: >-
      Corporate pages. 9 published at harvest time — Home, About Us, Our Science, Pipeline, News,
      Careers, Contact Us, Privacy Notices, Terms of Service.
  - name: media
    description: >-
      Media library. `X-WP-Total` reports 161 attachments, but only one attachment (id 1503) is
      returned to an anonymous caller; the remainder are attached to non-public parents.
  - name: taxonomy
    description: >-
      Categories and tags. Four categories are registered — Press Releases (14), In The News (4),
      Presentations and Publications (1), Uncategorized (0). The post_tag taxonomy holds three
      unused placeholder terms (Lorem, Ipsum, Dolor), all with a count of 0.
  - name: comments
    description: Comment collection. Registered and anonymously reachable, but empty — X-WP-Total is 0.
  - name: search
    description: Cross-content search across published posts and pages.
  - name: discovery
    description: Route, type, taxonomy and status discovery documents.
  - name: oembed
    description: oEmbed 1.0 provider endpoint for www.allaytx.com URLs.
paths:
  /:
    get:
      tags: [discovery]
      operationId: getApiIndex
      summary: Get the REST API index
      description: >-
        Returns the site index — name, URL, home, the ten registered namespaces, the supported
        authentication methods (WordPress application passwords), the site logo and icon, and the
        full 196-entry route table.
      parameters:
        - $ref: '#/components/parameters/Context'
        - name: namespace
          in: query
          description: Restrict the response to a single namespace.
          schema:
            type: string
            examples: ['wp/v2']
      responses:
        '200':
          description: Site index
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiIndex'

  /wp/v2/posts:
    get:
      tags: [posts]
      operationId: listPosts
      summary: List news posts
      description: >-
        Lists published posts. On this deployment the collection is the company news archive — 19
        items from the May 2021 launch through the June 2025 Series D. Paginated; `X-WP-Total` and
        `X-WP-TotalPages` are exposed via `Access-Control-Expose-Headers`, and a `Link` header
        carries `rel="next"` / `rel="prev"`.
      parameters:
        - $ref: '#/components/parameters/Context'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/ModifiedAfter'
        - $ref: '#/components/parameters/ModifiedBefore'
        - $ref: '#/components/parameters/Exclude'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Fields'
        - name: orderby
          in: query
          description: Sort collection by post attribute.
          schema:
            type: string
            enum: [author, date, id, include, modified, parent, relevance, slug, include_slugs, title]
            default: date
        - name: categories
          in: query
          description: Limit result set to items with specific category term IDs.
          schema: { type: array, items: { type: integer } }
        - name: categories_exclude
          in: query
          description: Ensure result set excludes items with specific category term IDs.
          schema: { type: array, items: { type: integer } }
        - name: tags
          in: query
          description: Limit result set to items with specific tag term IDs.
          schema: { type: array, items: { type: integer } }
        - name: tags_exclude
          in: query
          description: Ensure result set excludes items with specific tag term IDs.
          schema: { type: array, items: { type: integer } }
        - name: sticky
          in: query
          description: Limit result set to items that are sticky.
          schema: { type: boolean }
      responses:
        '200':
          description: A page of posts
          headers:
            X-WP-Total:
              description: Total number of items in the collection.
              schema: { type: integer }
            X-WP-TotalPages:
              description: Total number of pages available.
              schema: { type: integer }
            Link:
              description: RFC 8288 pagination links (rel="next", rel="prev").
              schema: { type: string }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/InvalidParam'

  /wp/v2/posts/{id}:
    get:
      tags: [posts]
      operationId: getPost
      summary: Get a single news post
      description: Retrieves one published post by numeric ID.
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/Context'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: A post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          $ref: '#/components/responses/PostNotFound'

  /wp/v2/pages:
    get:
      tags: [pages]
      operationId: listPages
      summary: List corporate pages
      description: >-
        Lists published pages. Nine at harvest time — Home, About Us, Our Science, Pipeline, News,
        Careers, Contact Us, Privacy Notices, Terms of Service.
      parameters:
        - $ref: '#/components/parameters/Context'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Exclude'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Fields'
        - name: parent
          in: query
          description: Limit result set to items with particular parent IDs.
          schema: { type: array, items: { type: integer } }
        - name: menu_order
          in: query
          description: Limit result set to posts with a specific menu_order value.
          schema: { type: integer }
      responses:
        '200':
          description: A page of pages
          headers:
            X-WP-Total:
              schema: { type: integer }
            X-WP-TotalPages:
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Page'
        '400':
          $ref: '#/components/responses/InvalidParam'

  /wp/v2/pages/{id}:
    get:
      tags: [pages]
      operationId: getPage
      summary: Get a single corporate page
      description: Retrieves one published page by numeric ID (e.g. 644 = Our Science, 653 = Pipeline).
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/Context'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: A page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '404':
          $ref: '#/components/responses/PostNotFound'

  /wp/v2/media:
    get:
      tags: [media]
      operationId: listMedia
      summary: List media attachments
      description: >-
        Lists media library attachments. `X-WP-Total` reports 161, but an anonymous caller receives
        a single attachment (id 1503); the rest are attached to non-public parents and are filtered
        out of the anonymous view.
      parameters:
        - $ref: '#/components/parameters/Context'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Fields'
        - name: media_type
          in: query
          description: Limit result set to attachments of a particular media type.
          schema:
            type: string
            enum: [image, video, text, application, audio]
        - name: mime_type
          in: query
          description: Limit result set to attachments of a particular MIME type.
          schema: { type: string }
      responses:
        '200':
          description: A page of attachments
          headers:
            X-WP-Total:
              schema: { type: integer }
            X-WP-TotalPages:
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attachment'

  /wp/v2/media/{id}:
    get:
      tags: [media]
      operationId: getMedia
      summary: Get a single media attachment
      description: Retrieves one attachment by numeric ID.
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/Context'
      responses:
        '200':
          description: An attachment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '404':
          $ref: '#/components/responses/PostNotFound'

  /wp/v2/categories:
    get:
      tags: [taxonomy]
      operationId: listCategories
      summary: List news categories
      description: >-
        Lists category terms. Four registered — Press Releases (id 5, 14 posts), In The News
        (id 10, 4 posts), Presentations and Publications (id 23, 1 post), Uncategorized (id 1, 0).
      parameters:
        - $ref: '#/components/parameters/Context'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Slug'
        - name: hide_empty
          in: query
          description: Whether to hide terms not assigned to any posts.
          schema: { type: boolean, default: false }
        - name: post
          in: query
          description: Limit result set to terms assigned to a specific post.
          schema: { type: integer }
      responses:
        '200':
          description: A page of category terms
          headers:
            X-WP-Total:
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Term'

  /wp/v2/categories/{id}:
    get:
      tags: [taxonomy]
      operationId: getCategory
      summary: Get a single category term
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/Context'
      responses:
        '200':
          description: A category term
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Term'
        '404':
          $ref: '#/components/responses/TermNotFound'

  /wp/v2/tags:
    get:
      tags: [taxonomy]
      operationId: listTags
      summary: List post tags
      description: >-
        Lists post_tag terms. Three placeholder terms are registered (Lorem, Ipsum, Dolor), all with
        a post count of 0 — the taxonomy is unused on this deployment.
      parameters:
        - $ref: '#/components/parameters/Context'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Slug'
        - name: hide_empty
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: A page of tag terms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Term'

  /wp/v2/tags/{id}:
    get:
      tags: [taxonomy]
      operationId: getTag
      summary: Get a single tag term
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/Context'
      responses:
        '200':
          description: A tag term
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Term'
        '404':
          $ref: '#/components/responses/TermNotFound'

  /wp/v2/comments:
    get:
      tags: [comments]
      operationId: listComments
      summary: List comments
      description: >-
        Lists approved comments. Registered and anonymously reachable, but empty on this
        deployment — `X-WP-Total` is 0.
      parameters:
        - $ref: '#/components/parameters/Context'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Order'
        - name: post
          in: query
          description: Limit result set to comments assigned to specific post IDs.
          schema: { type: array, items: { type: integer } }
      responses:
        '200':
          description: A page of comments (empty on this deployment)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /wp/v2/search:
    get:
      tags: [search]
      operationId: searchContent
      summary: Search across published content
      description: >-
        Cross-content search returning lightweight result objects (id, title, url, type, subtype).
        A search for "pain" returned 25 matches at harvest time.
      parameters:
        - $ref: '#/components/parameters/Context'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: type
          in: query
          description: Limit results to items of an object type.
          schema: { type: string, enum: [post, term, post-format], default: post }
        - name: subtype
          in: query
          description: Limit results to items of one or more object subtypes.
          schema: { type: array, items: { type: string } }
      responses:
        '200':
          description: A page of search results
          headers:
            X-WP-Total:
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchResult'

  /wp/v2/types:
    get:
      tags: [discovery]
      operationId: listTypes
      summary: List registered post types
      description: >-
        Returns the registered post types keyed by slug. At harvest: post, page, attachment,
        nav_menu_item, wp_block, wp_template, wp_template_part, wp_global_styles, wp_navigation,
        wp_font_family, wp_font_face.
      parameters:
        - $ref: '#/components/parameters/Context'
      responses:
        '200':
          description: Map of post types
          content:
            application/json:
              schema: { type: object }

  /wp/v2/types/{type}:
    get:
      tags: [discovery]
      operationId: getType
      summary: Get a single registered post type
      parameters:
        - name: type
          in: path
          required: true
          description: An alphanumeric identifier for the post type.
          schema: { type: string, examples: ['post'] }
        - $ref: '#/components/parameters/Context'
      responses:
        '200':
          description: A post type
          content:
            application/json:
              schema: { type: object }

  /wp/v2/taxonomies:
    get:
      tags: [discovery]
      operationId: listTaxonomies
      summary: List registered taxonomies
      description: 'Returns the registered taxonomies. At harvest: category, post_tag, nav_menu, wp_pattern_category.'
      parameters:
        - $ref: '#/components/parameters/Context'
        - name: type
          in: query
          description: Limit results to taxonomies associated with a specific post type.
          schema: { type: string }
      responses:
        '200':
          description: Map of taxonomies
          content:
            application/json:
              schema: { type: object }

  /wp/v2/taxonomies/{taxonomy}:
    get:
      tags: [discovery]
      operationId: getTaxonomy
      summary: Get a single registered taxonomy
      parameters:
        - name: taxonomy
          in: path
          required: true
          schema: { type: string, examples: ['category'] }
        - $ref: '#/components/parameters/Context'
      responses:
        '200':
          description: A taxonomy
          content:
            application/json:
              schema: { type: object }

  /wp/v2/statuses:
    get:
      tags: [discovery]
      operationId: listStatuses
      summary: List registered post statuses
      description: 'Returns the publicly queryable statuses. At harvest: publish, acf-disabled.'
      parameters:
        - $ref: '#/components/parameters/Context'
      responses:
        '200':
          description: Map of statuses
          content:
            application/json:
              schema: { type: object }

  /wp/v2/statuses/{status}:
    get:
      tags: [discovery]
      operationId: getStatus
      summary: Get a single registered post status
      parameters:
        - name: status
          in: path
          required: true
          schema: { type: string, examples: ['publish'] }
        - $ref: '#/components/parameters/Context'
      responses:
        '200':
          description: A post status
          content:
            application/json:
              schema: { type: object }

  /oembed/1.0/embed:
    get:
      tags: [oembed]
      operationId: getOembed
      summary: Get an oEmbed response for a site URL
      description: Returns the oEmbed 1.0 representation of a www.allaytx.com permalink.
      parameters:
        - name: url
          in: query
          required: true
          description: The URL of the resource for which to fetch oEmbed data.
          schema: { type: string, format: uri, examples: ['https://www.allaytx.com/'] }
        - name: format
          in: query
          description: The oEmbed format to use.
          schema: { type: string, enum: [json, xml], default: json }
        - name: maxwidth
          in: query
          description: The maximum width of the embed frame in pixels.
          schema: { type: integer, default: 600 }
      responses:
        '200':
          description: oEmbed document
          content:
            application/json:
              schema: { type: object }

components:
  parameters:
    Context:
      name: context
      in: query
      description: Scope under which the request is made; determines fields present in the response.
      schema:
        type: string
        enum: [view, embed, edit]
        default: view
    Page:
      name: page
      in: query
      description: Current page of the collection.
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      description: Maximum number of items to be returned in the result set.
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    Search:
      name: search
      in: query
      description: Limit results to those matching a string.
      schema: { type: string }
    After:
      name: after
      in: query
      description: Limit response to posts published after a given ISO8601 compliant date.
      schema: { type: string, format: date-time }
    Before:
      name: before
      in: query
      description: Limit response to posts published before a given ISO8601 compliant date.
      schema: { type: string, format: date-time }
    ModifiedAfter:
      name: modified_after
      in: query
      description: Limit response to posts modified after a given ISO8601 compliant date.
      schema: { type: string, format: date-time }
    ModifiedBefore:
      name: modified_before
      in: query
      description: Limit response to posts modified before a given ISO8601 compliant date.
      schema: { type: string, format: date-time }
    Exclude:
      name: exclude
      in: query
      description: Ensure result set excludes specific IDs.
      schema: { type: array, items: { type: integer } }
    Include:
      name: include
      in: query
      description: Limit result set to specific IDs.
      schema: { type: array, items: { type: integer } }
    Offset:
      name: offset
      in: query
      description: Offset the result set by a specific number of items.
      schema: { type: integer }
    Order:
      name: order
      in: query
      description: Order sort attribute ascending or descending.
      schema: { type: string, enum: [asc, desc], default: desc }
    Slug:
      name: slug
      in: query
      description: Limit result set to posts with one or more specific slugs.
      schema: { type: array, items: { type: string } }
    Fields:
      name: _fields
      in: query
      description: Sparse fieldset — comma-separated list of fields to include in the response.
      schema: { type: string, examples: ['id,date,slug,title,link'] }
    PathId:
      name: id
      in: path
      required: true
      description: Unique identifier for the object.
      schema: { type: integer }

  responses:
    InvalidParam:
      description: One or more query parameters failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            perPageOutOfBounds:
              value:
                code: rest_invalid_param
                message: 'Invalid parameter(s): per_page'
                data:
                  status: 400
                  params:
                    per_page: per_page must be between 1 (inclusive) and 100 (inclusive)
    PostNotFound:
      description: No object exists with the supplied ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPostId:
              value:
                code: rest_post_invalid_id
                message: Invalid post ID.
                data:
                  status: 404
    TermNotFound:
      description: No term exists with the supplied ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidTermId:
              value:
                code: rest_term_invalid
                message: Term does not exist.
                data:
                  status: 404

  schemas:
    Error:
      type: object
      description: >-
        The WordPress REST error envelope. Not RFC 9457 — the media type is application/json, and
        the shape is {code, message, data:{status}} with an optional data.params / data.details map
        on validation failures.
      required: [code, message, data]
      properties:
        code:
          type: string
          description: Machine-readable error code.
        message:
          type: string
          description: Human-readable error message.
        data:
          type: object
          properties:
            status:
              type: integer
              description: HTTP status code.
            params:
              type: object
              description: Per-parameter validation messages.
            details:
              type: object
              description: Per-parameter structured validation detail.

    RenderedText:
      type: object
      properties:
        rendered:
          type: string
          description: HTML for the field, transformed for display.
        protected:
          type: boolean

    Post:
      type: object
      description: A news post — press release, news coverage item, or presentation/publication.
      properties:
        id: { type: integer }
        date: { type: string, format: date-time, description: Publication date in the site timezone (America/New_York). }
        date_gmt: { type: string, format: date-time }
        modified: { type: string, format: date-time }
        modified_gmt: { type: string, format: date-time }
        guid: { $ref: '#/components/schemas/RenderedText' }
        slug: { type: string }
