apis:
- aid: allay-therapeutics:allay-therapeutics-content-api
  name: Allay Therapeutics Content API
  description: >-
    The anonymously readable WordPress REST API behind www.allaytx.com. It exposes the 19 published
    news items — press releases, in-the-news coverage and presentations/publications spanning the
    company's May 2021 launch through the June 2025 $57.5M Series D — the 9 published corporate
    pages (Home, About Us, Our Science, Pipeline, News, Careers, Contact Us, Privacy Notices, Terms
    of Service), the media library, the four news categories, the registered post types, taxonomies
    and statuses, cross-content search, and the oEmbed 1.0 provider endpoint. This is not a
    developer product Allay Therapeutics markets; it is the marketing site's own content surface,
    registered at /wp-json/ and verified to return data without credentials. The OpenAPI in this
    repo is derived from the published route index.
  humanURL: https://developer.wordpress.org/rest-api/
  baseURL: https://www.allaytx.com/wp-json
  tags:
  - content
  - wordpress
  - corporate
  - news
  - press-releases
  properties:
