aid: allay-therapeutics
name: Allay Therapeutics
description: 'Allay Therapeutics is a clinical-stage biopharmaceutical company with operations
  in San Jose, California and Singapore, developing ultra-sustained, non-opioid analgesic
  products for post-surgical pain management. Its platform is a tunable drug-biopolymer
  architecture that pairs validated non-opioid analgesics with dissolvable biopolymers to
  release pain relief at a targeted surgical site over weeks rather than days, and can be
  tuned for constant release (chronic pain such as osteoarthritis) or pulsed release (cyclic
  pain such as gout). Lead candidate ATX-101 is a bupivacaine-based implant placed directly
  at the surgical site during total knee replacement (TKA), targeting the three-day to
  two-week analgesia gap that drives breakthrough pain and opioid use; it holds FDA
  Breakthrough Therapy Designation and entered a pivotal Phase 2b registration trial with
  first patients dosed in 2025. Additional programs (ATX-201, ATX-301, ATX-401, ATX-501) span
  new formulations, injectables, additional clinical indications and on-demand anesthetic
  delivery. The company raised a $57.5M Series D plus a venture debt line in 2025 and has a
  development and commercialization agreement with Maruishi Pharmaceutical for Japan. It is a
  therapeutics developer, not a software company, and publishes no developer program, API,
  SDK, or machine-readable interface.'
