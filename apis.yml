  - type: DataModel
    url: data-model/allay-therapeutics-data-model.yml
  x-contract-provenance: >-
    Derived by the API Evangelist enrichment pipeline from the WordPress REST route index the site
    publishes at https://www.allaytx.com/wp-json/ — 196 routes across 10 namespaces (oembed/1.0,
    wpe/cache-plugin/v1, wpe_sign_on_plugin/v1, yoast/v1, duplicate-post/v1, monsterinsights/v1,
    wp/v2, wp-site-health/v1, wp-block-editor/v1, wp-abilities/v1) — and verified against live
    anonymous responses on 2026-08-06. Only operations that returned data without credentials are
    modelled; every write route and the entire plugin-administration surface is excluded. Anonymous
    401s recorded at harvest: /wp/v2/settings, /wp/v2/menus, /wp/v2/themes, /wp/v2/plugins,
    /wp/v2/block-types, /wp/v2/font-collections, /wp/v2/icons and the whole wp-abilities/v1
    agent-capability namespace — so no MCP, agent-tool or AgentCard surface is claimed for this
    provider. DELIBERATE EXCLUSION: /wp/v2/users answers anonymously with author records; the
    exposure is recorded in data-model/ and skills/_index.yml but is not modelled as an operation,
    not packaged as an agent skill, and no individual is named anywhere in this repository. Allay
    Therapeutics publishes no developer documentation, no API reference, no getting-started guide
    and no support channel for this surface, so no Documentation / APIReference / GettingStarted /
    Support pointers are emitted; the humanURL above is the upstream WordPress REST handbook that
    defines the wp/v2 contract.
